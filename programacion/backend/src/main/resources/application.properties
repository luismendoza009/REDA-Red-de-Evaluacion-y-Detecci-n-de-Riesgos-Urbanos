# =============================================================================
# Configuración de REDA. Los SECRETOS no van aquí: se leen de variables de entorno.
#   REDA_DB_URL      (por defecto jdbc:postgresql://localhost:5432/reda)
#   REDA_DB_USUARIO  (por defecto postgres)
#   REDA_DB_CLAVE    (obligatoria)
#   REDA_JWT_SECRETO (obligatoria, mínimo 32 caracteres)
# Ver application-example.properties y README.
# =============================================================================
spring.application.name=reda
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${REDA_DB_URL:jdbc:postgresql://localhost:5432/reda}
spring.datasource.username=${REDA_DB_USUARIO:postgres}
spring.datasource.password=${REDA_DB_CLAVE}

# El esquema lo crean las migraciones SQL (migraciones/NNN_*.sql), nunca Hibernate.
# "validate" hace que la aplicación NO arranque si las entidades Java no coinciden con
# las tablas reales: es una prueba de integración automática entre las dos capas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# Las fechas del JSON se muestran en hora de Colombia (con su desfase -05:00)
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-with-context-time-zone=true

reda.jwt.secreto=${REDA_JWT_SECRETO}
reda.jwt.minutos-expiracion=120
# Radio de búsqueda de antecedentes (decisión D09 en documentacion/decisiones.md)
reda.antecedentes.radio-metros=100
# Fotos de evidencia: carpeta en disco (fuera del repositorio, ver .gitignore) y límites de carga
reda.almacenamiento.directorio=${REDA_DIR_ARCHIVOS:./almacenamiento}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Reportes a menos de esta distancia se muestran como un mismo punto del mapa
reda.mapa.radio-agrupacion-metros=80
# Sugerencia de barrio al marcar un punto: barrio con punto de referencia más cercano, solo si está a 600 m o menos
reda.zonas.radio-sugerencia-metros=600
# Servicio de búsqueda de direcciones, compatible con la API de búsqueda Nominatim
reda.geocodificacion.endpoint=${REDA_GEOCODIFICACION_ENDPOINT:https://nominatim.openstreetmap.org/search}
# Orígenes permitidos para el frontend (CORS restrictivo)
reda.cors.origenes=http://localhost:4200
# Dirección con la que se arman los enlaces de los correos (recuperación de contraseña)
reda.correo.url-base=${REDA_URL_BASE:http://localhost:8080}

springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-stacktrace=never
