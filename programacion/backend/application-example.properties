# Copia este archivo como backend/application-local.properties (está en .gitignore)
# y pon tus valores. NUNCA subas application-local.properties al repositorio.
spring.datasource.url=jdbc:postgresql://localhost:5432/reda
spring.datasource.username=postgres
spring.datasource.password=TU_CLAVE_DE_POSTGRES
# Cualquier texto largo y aleatorio (mínimo 32 caracteres). Ejemplo para generarlo en PowerShell:
#   -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 48 | % {[char]$_})
reda.jwt.secreto=CAMBIA_ESTE_TEXTO_POR_UNO_ALEATORIO_DE_48_CARACTERES
# Endpoint compatible con la API de búsqueda Nominatim; se puede reemplazar con REDA_GEOCODIFICACION_ENDPOINT.
reda.geocodificacion.endpoint=${REDA_GEOCODIFICACION_ENDPOINT:https://nominatim.openstreetmap.org/search}
